<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tajiri 3 Inc.</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 50px 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            max-width: 500px;
            width: 90%;
        }
        h1 { font-size: 2.8rem; margin-bottom: 15px; letter-spacing: 1px; text-transform: uppercase; }
        p { font-size: 1.2rem; color: #e0e6ed; line-height: 1.6; }
        .divider { height: 3px; width: 60px; background-color: #ffb703; margin: 20px auto; border-radius: 2px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tajiri 3 Inc.</h1>
        <div class="divider"></div>
        <p>Our brand new professional website is currently under construction.</p>
        <p style="margin-top: 10px; font-size: 1rem; color: #a5b4fc;">We look forward to launching soon!</p>
    </div>
</body>
</html>
